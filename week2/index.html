<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content-Based Movie Recommender</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Content-Based Movie Recommender</h1>

        <h2>Item-to-Item</h2>
        <p>Select a movie you like, and we'll find the 5 most similar ones (cosine similarity on genre vectors).</p>

        <div class="controls">
            <select id="movie-select" class="select-control">
                <option value="" disabled selected>Select a movie</option>
            </select>
            <button id="recommend-btn" class="btn" onclick="getRecommendations()">Get Recommendations</button>
        </div>

        <h2>Profile-Based</h2>
        <p>Select 3 movies to build your taste profile, then get the 5 best matches.</p>

        <div class="controls">
            <select id="profile-select-1" class="select-control">
                <option value="" disabled selected>Movie 1</option>
            </select>
            <select id="profile-select-2" class="select-control">
                <option value="" disabled selected>Movie 2</option>
            </select>
            <select id="profile-select-3" class="select-control">
                <option value="" disabled selected>Movie 3</option>
            </select>
            <button id="profile-btn" class="btn" onclick="getProfileRecommendations()">Get Profile Recommendations</button>
        </div>

        <div id="result-box">
            <p id="result">Please wait, loading data...</p>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
